apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: match-label-example
  namespace:  replicaset-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubia
  template:
    metadata:
      labels:
        app: kubia
    spec:
      containers:
        - name: myapp
          image: luksa/kubia
          resources:
            limits:
              memory: "2048Mi"
              cpu: "1000m"

