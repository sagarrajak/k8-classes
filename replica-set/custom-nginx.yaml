apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: custom-nginx
  namespace: 'replicaset-example'
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      app: 'custom-nginx'
  template:
    metadata:
      labels:
        app: 'custom-nginx'
    spec:
      containers:
      - name: nginx
        image: test-nginx:1.0
        ports:
        - name: web
          containerPort:  80
          protocol: TCP