# https://kubernetes.io/docs/concepts/storage/persistent-volumes/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mikube-pvc
  namespace: default
  labels:
    app: mikube-pvc
spec:
  storageClassName: minikube-hostpath
  accessModes:
  - ReadWriteOnce
  - ReadOnlyMany
  resources:
    requests:
      storage: 2Gi

