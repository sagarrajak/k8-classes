apiVersion: v1
kind: Pod
metadata:
  name: "mongodb-pod"
  namespace: default
  labels:
    app: "mongodb-pod"
spec:
  containers:
  - name: mongodb-pod
    image: mongo
    resources:
      limits:
        cpu: 1000m
        memory: 2048Mi
      requests:
        cpu: 100m
        memory: 200Mi
    ports:
    - containerPort:  27017
      name:  mongoport
    volumeMounts:
    - name: mongodb-data
      mountPath: /data/db
  volumes:
    - name: mongodb-data
      persistentVolumeClaim:
        claimName: mongodb-pvc