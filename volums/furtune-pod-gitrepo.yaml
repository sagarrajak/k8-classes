# https://kubernetes.io/docs/concepts/workloads/pods/
apiVersion: v1
kind: Pod
metadata:
  name: furtune-gitrepo
  namespace: default
  labels:
    app: furtune
spec:
  containers:
  - name: html-generatror
    image: "luksa/fortune"
    volumeMounts:
    - name: html
      mountPath: /var/htdocs
  - name: nginx-container
    image: nginx:alpine
    volumeMounts:
      - name: html
        mountPath: /usr/share/nginx/html
        readOnly: true
    ports:
    - containerPort: 80
      name: http
      protocol: TCP
  volumes:
    - name:  html
      gitRepo:
        repository: https://github.com/luksa/kubia-website-example.git
        revision: master
        directory: .
