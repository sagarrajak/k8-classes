apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-backup-jobs
  namespace: jobs-space
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox
            args: ['/bin/sh', '-c', 'date; echo Hello from the Kubernetes cluster']
          restartPolicy: OnFailure