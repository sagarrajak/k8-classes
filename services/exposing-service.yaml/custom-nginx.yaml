# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: custom-nginx-service
  namespace: replicaset-example
spec:
  selector:
    app: custom-nginx
  type: NodePort
  ports:
  - name: http
    protocol: TCP
    port: 8080  # Service port (ClusterIP)
    targetPort: 80 # Container port inside the Pod
    nodePort: 30011  # External port on the Node (range: 30000–32767)

