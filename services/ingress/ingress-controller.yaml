apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
  namespace: replicaset-example
  annotations:
    # Add ingress controller specific annotations if needed
    # For nginx ingress controller:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: test.sagar
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kubia
              port:
                number: 80
        - path: /kubia
          pathType: Prefix
          backend:
            service:
              name: kubia
              port:
                number: 80
        - path: /custom
          pathType: Prefix
          backend:
            service:
              name: custom-nginx-service
              port:
                number: 8080