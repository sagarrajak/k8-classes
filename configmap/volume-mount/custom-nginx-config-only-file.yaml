# https://kubernetes.io/docs/concepts/workloads/pods/
apiVersion: v1
kind: Pod
metadata:
  name: "volume-mount-nginx-only-file"
  namespace: default
  labels:
    app: "volume-mount-nginx-only-file"
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 200Mi
    ports:
    - containerPort: 80
      name: http
      hostPort: 8081
    volumeMounts:
    - name: config
      mountPath: /etc/nginx/conf.d
  volumes:
    - name: config
      configMap:
        name: fortune-nginx-config

